<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lava Orb — Liquid Test v3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; font-family: -apple-system, sans-serif; }
    #info { position: fixed; top: 8px; left: 8px; font: 12px monospace; color: #aaa;
      background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 4px; z-index: 100; }
    #panel { position: fixed; top: 8px; right: 8px; width: 230px;
      background: rgba(0,0,0,0.75); padding: 10px; border-radius: 6px;
      z-index: 100; font-size: 12px; color: #ccc; max-height: calc(100vh - 16px); overflow-y: auto; }
    #panel .row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0; }
    #panel .row span { min-width: 32px; text-align: right; font: 11px monospace; color: #8cf; }
    #panel input[type=range] { width: 80px; }
    #panel label { display: flex; align-items: center; gap: 4px; margin: 2px 0; }
    #panel .section { margin-top: 8px; border-top: 1px solid #333; padding-top: 6px; }
    #panel .section-head { cursor: pointer; font-weight: 600; color: #4af; user-select: none; }
    #panel .section-body { overflow: hidden; }
    #panel .section-body.collapsed { max-height: 0 !important; }
    #panel button { padding: 4px 8px; font-size: 11px; border: 1px solid #555; border-radius: 3px;
      cursor: pointer; background: #222; color: #ccc; margin: 2px; }
    #panel button:hover { background: #333; }
    #panel select { background: #222; color: #ccc; border: 1px solid #555; border-radius: 3px; padding: 2px; font-size: 11px; width: 100%; }
    #perf-stats { font: 11px monospace; color: #8f8; margin-top: 4px; }
    canvas#c { display: block; position: relative; z-index: 1; }
    canvas#gl { position: fixed; top: 0; left: 0; z-index: 0; display: none; }
  </style>
</head>
<body>
  <div id="info">Drag & throw orbs. They merge on collision!<br><span id="dbg"></span></div>
  <div id="panel">
    <div style="font-weight:700;margin-bottom:6px;">Liquid Controls</div>
    <div style="margin-bottom:6px;">
      <button id="btn-add" style="background:#264;color:#8f8;border-color:#4a8;">+ Add Orb</button>
      <button id="btn-reset-orbs" style="background:#422;color:#f88;border-color:#844;">Clear All</button>
      <label style="font-size:11px;color:#8cf;gap:3px;margin-left:6px;"><input type="checkbox" id="c-webgl2"> WebGL2</label>
    </div>
    <div class="row" style="margin-bottom:6px;"><label>Background</label>
      <select id="bg-select">
        <option value="none" selected>None</option>
        <option value="ocean">Ocean</option>
        <option value="space">Space</option>
        <option value="abstract">Abstract</option>
      </select>
    </div>
    <div class="row"><label>Temperature</label><input type="range" id="c-val" min="1" max="10" value="5"><span id="v-val">5</span></div>
    <div class="row"><label>Orb size</label><input type="range" id="c-orbsize" min="30" max="120" value="60"><span id="v-orbsize">60</span></div>
    <div class="row"><label>Fill %</label><input type="range" id="c-fill" min="10" max="90" value="50"><span id="v-fill">50</span></div>
    <div class="row"><label>Columns</label><input type="range" id="c-cols" min="8" max="48" value="24"><span id="v-cols">24</span></div>
    <div class="row"><label>Spring</label><input type="range" id="c-spring" min="1" max="15" value="5"><span id="v-spring">.05</span></div>
    <div class="row"><label>Damping</label><input type="range" id="c-damp" min="950" max="998" value="975"><span id="v-damp">.975</span></div>
    <div class="row"><label>Sloshing</label><input type="range" id="c-slosh" min="1" max="30" value="10"><span id="v-slosh">1.0</span></div>
    <div class="row"><label>Cracks</label><input type="range" id="c-cracks" min="0" max="12" value="0"><span id="v-cracks">0</span></div>
    <div class="row"><label>Inner splash</label><input type="range" id="c-isplash" min="0" max="20" value="8"><span id="v-isplash">8</span></div>
    <div class="row"><label>Outer splash</label><input type="range" id="c-osplash" min="0" max="20" value="5"><span id="v-osplash">5</span></div>
    <div class="row"><label>Merge loss %</label><input type="range" id="c-mergeloss" min="0" max="50" value="25"><span id="v-mergeloss">25</span></div>
    <div class="row"><label>Air drag</label><input type="range" id="c-airDrag" min="990" max="1000" value="998"><span id="v-airDrag">.998</span></div>
    <div class="row"><label>Bounce</label><input type="range" id="c-bounce" min="20" max="95" value="55"><span id="v-bounce">.55</span></div>

    <div class="section">
      <div class="section-head" onclick="this.nextElementSibling.classList.toggle('collapsed')">&#9656; Collisions</div>
      <div class="section-body collapsed">
        <div class="row" style="margin-bottom:4px;"><label>Mode</label>
          <select id="c-collisionMode">
            <option value="merge" selected>merge</option>
            <option value="bounce-explode">bounce-explode</option>
            <option value="bounce">bounce</option>
            <option value="none">none</option>
          </select>
        </div>
        <div class="row"><label>Blast power</label><input type="range" id="c-blastPower" min="2" max="30" value="10"><span id="v-blastPower">1.0</span></div>
        <div class="row"><label>Wave force</label><input type="range" id="c-waveForce" min="0" max="30" value="15"><span id="v-waveForce">15</span></div>
        <div class="row"><label>Wave radius</label><input type="range" id="c-waveRadius" min="50" max="800" value="400"><span id="v-waveRadius">400</span></div>
        <div class="row"><label>Shake intensity</label><input type="range" id="c-shakeIntensity" min="0" max="15" value="7"><span id="v-shakeIntensity">0.7</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head" onclick="this.nextElementSibling.classList.toggle('collapsed')">&#9656; Advanced</div>
      <div class="section-body collapsed">
        <div class="row"><label>Spread</label><input type="range" id="c-spread" min="5" max="50" value="25"><span id="v-spread">.25</span></div>
        <div class="row"><label>Substeps</label><input type="range" id="c-substeps" min="1" max="8" value="4"><span id="v-substeps">4</span></div>
        <div class="row"><label>Layers</label><input type="range" id="c-layers" min="1" max="5" value="3"><span id="v-layers">3</span></div>
        <label><input type="checkbox" id="c-showFill"> Show fill %</label>
        <label><input type="checkbox" id="c-embers" checked> Embers</label>
        <label><input type="checkbox" id="c-bubbles" checked> Bubbles</label>
        <label><input type="checkbox" id="c-glow" checked> Surface glow</label>
        <label><input type="checkbox" id="c-glass" checked> Glass highlight</label>
      </div>
    </div>

    <div class="section">
      <div class="section-head" onclick="this.nextElementSibling.classList.toggle('collapsed')">&#9656; Performance</div>
      <div class="section-body collapsed">
        <div id="perf-stats">FPS: -- | Particles: --</div>
        <div class="row"><label>Max particles</label><input type="range" id="c-maxParticles" min="200" max="10000" value="5000"><span id="v-maxParticles">5000</span></div>
        <label><input type="checkbox" id="c-autoAdapt"> Auto-adapt</label>
        <label><input type="checkbox" id="c-objectPooling"> Object pooling</label>
      </div>
    </div>

    <div class="section">
      <div class="section-head">Presets</div>
      <div style="margin-top:4px;">
        <button id="btn-save">Save</button>
        <button id="btn-load">Load</button>
        <input type="file" id="file-load" accept=".json" style="display:none;">
      </div>
      <select id="preset-list" style="margin-top:4px;">
        <option value="">-- built-in --</option>
        <option value="water">Water</option>
        <option value="lava">Lava</option>
        <option value="mercury">Mercury</option>
        <option value="jelly">Jelly</option>
      </select>
      <button id="btn-apply" style="margin-top:2px;">Apply</button>
    </div>
  </div>

  <canvas id="gl"></canvas>
  <canvas id="c"></canvas>
  <script>
  (function() {
    var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    canvas.width = innerWidth; canvas.height = innerHeight;
    onresize = function() {
      canvas.width = innerWidth; canvas.height = innerHeight;
      if (RENDERER === 'webgl2') {
        glCanvas.width = innerWidth; glCanvas.height = innerHeight;
        glW = innerWidth; glH = innerHeight;
      }
    };

    // ========= BACKGROUND =========
    var BG_MODE = 'none';
    var bgSelectEl = document.getElementById('bg-select');
    var savedLiquidBg = localStorage.getItem('liquid-orb-bg');
    if (savedLiquidBg && savedLiquidBg !== 'none') {
      BG_MODE = savedLiquidBg;
      bgSelectEl.value = savedLiquidBg;
    }
    bgSelectEl.onchange = function() {
      BG_MODE = this.value;
      localStorage.setItem('liquid-orb-bg', BG_MODE);
    };

    // Pre-generate star positions for Space background (150 stars)
    var bgStars = [];
    for (var _si = 0; _si < 150; _si++) {
      bgStars.push({
        x: Math.random(),
        y: Math.random(),
        size: 0.5 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.5 + Math.random() * 2
      });
    }

    // Pre-generate bubble data for Ocean background (25 bubbles)
    var bgBubbles = [];
    for (var _bi = 0; _bi < 25; _bi++) {
      bgBubbles.push({
        x: Math.random(),
        phase: Math.random() * Math.PI * 2,
        speed: 0.3 + Math.random() * 0.7,
        size: 1 + Math.random() * 3,
        yOffset: Math.random()
      });
    }

    // Pre-generate abstract blob data
    var bgBlobs = [
      { cx: 0.3, cy: 0.4, r: 0.25, hueOff: 0, sx: 0.7, sy: 0.5 },
      { cx: 0.7, cy: 0.6, r: 0.3, hueOff: 90, sx: 0.5, sy: 0.8 },
      { cx: 0.5, cy: 0.3, r: 0.2, hueOff: 180, sx: 0.9, sy: 0.6 },
      { cx: 0.6, cy: 0.7, r: 0.22, hueOff: 270, sx: 0.6, sy: 0.4 }
    ];

    function drawBgCanvas2D(bgCtx, w, h, time) {
      if (BG_MODE === 'ocean') {
        // Deep blue-to-teal vertical gradient
        var oceanGrad = bgCtx.createLinearGradient(0, 0, 0, h);
        oceanGrad.addColorStop(0, '#0a1628');
        oceanGrad.addColorStop(0.4, '#0c2a4a');
        oceanGrad.addColorStop(0.7, '#0e3a5a');
        oceanGrad.addColorStop(1, '#0a4a5a');
        bgCtx.fillStyle = oceanGrad;
        bgCtx.fillRect(0, 0, w, h);

        // Caustic light patterns
        bgCtx.globalCompositeOperation = 'lighter';
        bgCtx.globalAlpha = 0.06;
        for (var ci = 0; ci < 6; ci++) {
          var freq = 0.005 + ci * 0.003;
          var phaseOff = ci * 1.3;
          bgCtx.strokeStyle = ci < 3 ? 'rgba(100,200,255,1)' : 'rgba(80,255,220,1)';
          bgCtx.lineWidth = 1.5;
          bgCtx.beginPath();
          for (var cx = 0; cx < w; cx += 4) {
            var cy = h * 0.3 + Math.sin(cx * freq + time * 0.5 + phaseOff) * 40
              + Math.sin(cx * freq * 1.7 + time * 0.3 + phaseOff * 2) * 25;
            cx === 0 ? bgCtx.moveTo(cx, cy) : bgCtx.lineTo(cx, cy);
          }
          bgCtx.stroke();
        }

        // Light rays from top (4 beams)
        bgCtx.globalAlpha = 0.04;
        for (var ri = 0; ri < 4; ri++) {
          var rayX = w * (0.2 + ri * 0.2) + Math.sin(time * 0.3 + ri * 2.1) * 60;
          var rayW = 30 + Math.sin(time * 0.2 + ri) * 10;
          var rayGrad = bgCtx.createLinearGradient(rayX, 0, rayX, h * 0.8);
          rayGrad.addColorStop(0, 'rgba(150,220,255,1)');
          rayGrad.addColorStop(1, 'rgba(150,220,255,0)');
          bgCtx.fillStyle = rayGrad;
          bgCtx.beginPath();
          bgCtx.moveTo(rayX - rayW * 0.5, 0);
          bgCtx.lineTo(rayX + rayW * 0.5, 0);
          bgCtx.lineTo(rayX + rayW * 2, h * 0.8);
          bgCtx.lineTo(rayX - rayW * 1.5, h * 0.8);
          bgCtx.closePath();
          bgCtx.fill();
        }

        // Bubbles / plankton floating upward
        bgCtx.globalCompositeOperation = 'source-over';
        bgCtx.globalAlpha = 1;
        for (var bi = 0; bi < bgBubbles.length; bi++) {
          var bub = bgBubbles[bi];
          var bubX = bub.x * w + Math.sin(time * 0.5 + bub.phase) * 15;
          var bubY = ((bub.yOffset + time * bub.speed * 0.02) % 1.2) * h;
          bubY = h - bubY; // float upward
          if (bubY < -10) continue;
          bgCtx.globalAlpha = 0.15 + Math.sin(time * bub.speed + bub.phase) * 0.08;
          bgCtx.fillStyle = 'rgba(150,220,255,1)';
          bgCtx.beginPath();
          bgCtx.arc(bubX, bubY, bub.size, 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.globalAlpha = 1;
        bgCtx.globalCompositeOperation = 'source-over';

      } else if (BG_MODE === 'space') {
        // Dark navy/black gradient
        var spaceGrad = bgCtx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.7);
        spaceGrad.addColorStop(0, '#0a0a1a');
        spaceGrad.addColorStop(1, '#020208');
        bgCtx.fillStyle = spaceGrad;
        bgCtx.fillRect(0, 0, w, h);

        // Stars with twinkling
        for (var si = 0; si < bgStars.length; si++) {
          var star = bgStars[si];
          var twinkle = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * star.speed + star.phase));
          bgCtx.globalAlpha = twinkle;
          bgCtx.fillStyle = '#fff';
          bgCtx.beginPath();
          bgCtx.arc(star.x * w, star.y * h, star.size * twinkle, 0, Math.PI * 2);
          bgCtx.fill();
        }

        // Nebula clouds (3 soft radial gradients)
        bgCtx.globalCompositeOperation = 'lighter';
        var nebulaColors = [
          [80, 40, 120], [40, 60, 140], [100, 30, 80]
        ];
        for (var ni = 0; ni < 3; ni++) {
          var nc = nebulaColors[ni];
          var nx = w * (0.3 + ni * 0.25) + Math.sin(time * 0.1 + ni * 2.5) * 80;
          var ny = h * (0.3 + ni * 0.2) + Math.cos(time * 0.08 + ni * 1.7) * 60;
          var nr = Math.min(w, h) * (0.15 + 0.05 * Math.sin(time * 0.15 + ni));
          bgCtx.globalAlpha = 0.08 + 0.03 * Math.sin(time * 0.2 + ni * 3);
          var nebGrad = bgCtx.createRadialGradient(nx, ny, 0, nx, ny, nr);
          nebGrad.addColorStop(0, 'rgba(' + nc[0] + ',' + nc[1] + ',' + nc[2] + ',1)');
          nebGrad.addColorStop(1, 'rgba(' + nc[0] + ',' + nc[1] + ',' + nc[2] + ',0)');
          bgCtx.fillStyle = nebGrad;
          bgCtx.beginPath();
          bgCtx.arc(nx, ny, nr, 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.globalAlpha = 1;
        bgCtx.globalCompositeOperation = 'source-over';

      } else if (BG_MODE === 'abstract') {
        // Dark base
        bgCtx.fillStyle = '#0a0a0a';
        bgCtx.fillRect(0, 0, w, h);

        // Animated color blobs with hue cycling
        bgCtx.globalCompositeOperation = 'lighter';
        for (var ai = 0; ai < bgBlobs.length; ai++) {
          var blob = bgBlobs[ai];
          var bx = blob.cx * w + Math.sin(time * 0.15 * blob.sx + ai * 1.5) * w * 0.2;
          var by = blob.cy * h + Math.cos(time * 0.12 * blob.sy + ai * 2.1) * h * 0.2;
          var br = blob.r * Math.min(w, h) * (0.8 + 0.2 * Math.sin(time * 0.1 + ai));
          var hue = (blob.hueOff + time * 8) % 360;
          bgCtx.globalAlpha = 0.12 + 0.04 * Math.sin(time * 0.3 + ai * 1.7);
          var blobGrad = bgCtx.createRadialGradient(bx, by, 0, bx, by, br);
          blobGrad.addColorStop(0, 'hsl(' + hue + ',70%,50%)');
          blobGrad.addColorStop(0.5, 'hsl(' + ((hue + 30) % 360) + ',60%,35%)');
          blobGrad.addColorStop(1, 'hsl(' + ((hue + 60) % 360) + ',50%,10%)');
          bgCtx.fillStyle = blobGrad;
          bgCtx.beginPath();
          bgCtx.arc(bx, by, br, 0, Math.PI * 2);
          bgCtx.fill();
        }
        bgCtx.globalAlpha = 1;
        bgCtx.globalCompositeOperation = 'source-over';
      }
    }

    // ========= RENDERER TOGGLE =========
    var RENDERER = 'canvas2d';
    var glCanvas = document.getElementById('gl');
    var gl = null;
    var glW = 0, glH = 0;
    var glProgLiquid = null;
    var glQuad = null; // {vao, count}

    function hexToRGB(hex) {
      var r = parseInt(hex.substr(1,2), 16) / 255;
      var g = parseInt(hex.substr(3,2), 16) / 255;
      var b = parseInt(hex.substr(5,2), 16) / 255;
      return [r, g, b];
    }

    var PALETTES = [null,
      ['#6494ED','#8AB4FF','#2A4480','#4A74CD'],['#5A9DE6','#7CB8F0','#1A5090','#3A7DC6'],
      ['#4FB8D0','#6FD8E8','#1A6878','#3098B0'],['#45C4AA','#65E4CA','#0A6050','#25A48A'],
      ['#4ABA7A','#6ADA9A','#0A5A30','#2A9A5A'],['#7AB648','#9AD668','#3A5610','#5A9628'],
      ['#B5A234','#D5C254','#5A4A08','#958214'],['#E09028','#FFB848','#6A3000','#C07010'],
      ['#E8703A','#FF9060','#6A2008','#C8501A'],['#E05A5A','#FF7A7A','#6A1010','#C03A3A']
    ];
    var PALETTE_RGB = [];
    for (var _pi = 0; _pi <= 10; _pi++) {
      if (!PALETTES[_pi]) { PALETTE_RGB.push(null); continue; }
      PALETTE_RGB.push(PALETTES[_pi].map(hexToRGB));
    }

    function tempParams(val) {
      var table = [
        null,
        {fill:.45,amp:0,speed:0,embers:0,bubble:0,frost:1},
        {fill:.40,amp:.8,speed:.3,embers:0,bubble:0,frost:1},
        {fill:.42,amp:1.2,speed:.5,embers:0,bubble:.1,frost:0},
        {fill:.44,amp:1.8,speed:.7,embers:1,bubble:.2,frost:0},
        {fill:.48,amp:2.5,speed:1,embers:3,bubble:.3,frost:0},
        {fill:.50,amp:3,speed:1.2,embers:4,bubble:.4,frost:0},
        {fill:.54,amp:3.5,speed:1.5,embers:5,bubble:.6,frost:0},
        {fill:.58,amp:4.2,speed:1.8,embers:6,bubble:.8,frost:0},
        {fill:.70,amp:5.5,speed:2.5,embers:10,bubble:1,frost:0},
        {fill:.85,amp:7,speed:3.2,embers:12,bubble:1,frost:0}
      ];
      return table[Math.max(1,Math.min(10,val))];
    }

    var cfg = {
      val:5, orbSize:60, fill:50, cols:24, spring:.05, damping:.975,
      spread:.25, sloshing:1, cracks:0, innerSplash:8, outerSplash:5,
      mergeLoss:25, substeps:4, layers:3,
      showFill:0, embers:1, bubbles:1, surfaceGlow:1, glass:1,
      collisionMode:'merge',
      airDrag:.998, bounce:.55,
      maxParticles:5000, autoAdapt:0, objectPooling:0
    };
    var orbRadius = cfg.orbSize / 2;

    // Explosion config (separate from cfg)
    var expCfg = {
      blastPower: 1.0,
      waveForce: 15,
      waveRadius: 400,
      shakeIntensity: 0.7
    };

    var PRESETS = {
      water:   {val:4,spring:.04,damping:.98,spread:.3,sloshing:1.2,cols:32},
      lava:    {val:9,spring:.03,damping:.99,spread:.15,sloshing:.6,cols:24},
      mercury: {val:6,spring:.08,damping:.97,spread:.35,sloshing:.5,cols:20},
      jelly:   {val:5,spring:.10,damping:.992,spread:.4,sloshing:2,cols:16}
    };

    // ========= WEBGL2 SHADERS =========
    var VS_LIQUID = '#version 300 es\n' +
      'layout(location=0) in vec2 a_Coord;\n' +
      'layout(location=1) in vec2 a_TexCoord;\n' +
      'uniform mat4 u_Proj;\n' +
      'uniform vec2 u_Pos;\n' +
      'uniform float u_QuadSize;\n' +
      'out vec2 v_UV;\n' +
      'void main() {\n' +
      '  gl_Position = u_Proj * vec4(u_Pos + a_Coord * u_QuadSize, 0.0, 1.0);\n' +
      '  v_UV = a_TexCoord;\n' +
      '}\n';

    var FS_LIQUID = '#version 300 es\n' +
      'precision mediump float;\n' +
      'in vec2 v_UV;\n' +
      'uniform float u_OrbRadius;\n' +
      'uniform float u_Fill;\n' +
      'uniform float u_Tilt;\n' +
      'uniform float u_Time;\n' +
      'uniform float u_Val;\n' +
      'uniform int u_Cols;\n' +
      'uniform int u_Layers;\n' +
      'uniform float u_WaveH[48];\n' +
      'uniform float u_Amp;\n' +
      'uniform float u_Speed;\n' +
      'uniform vec3 u_Pal[4];\n' +
      'uniform float u_GlowEnabled;\n' +
      'out vec4 fragColor;\n' +
      // Catmull-Rom interpolation
      'float catmullRom(float idx) {\n' +
      '  int i = int(floor(idx));\n' +
      '  float t = fract(idx);\n' +
      '  float p0 = u_WaveH[clamp(i-1, 0, u_Cols-1)];\n' +
      '  float p1 = u_WaveH[clamp(i, 0, u_Cols-1)];\n' +
      '  float p2 = u_WaveH[clamp(i+1, 0, u_Cols-1)];\n' +
      '  float p3 = u_WaveH[clamp(i+2, 0, u_Cols-1)];\n' +
      '  float t2 = t*t, t3 = t2*t;\n' +
      '  return 0.5 * ((2.0*p1) + (-p0+p2)*t + (2.0*p0-5.0*p1+4.0*p2-p3)*t2 + (-p0+3.0*p1-3.0*p2+p3)*t3);\n' +
      '}\n' +
      // Wave surface Y at local X
      'float waveSurface(float localX, float am, float fr, float sp) {\n' +
      '  float oR = u_OrbRadius;\n' +

      var uOrbRadius = gl.getUniformLocation(glProgLiquid, 'u_OrbRadius');
      var uFill = gl.getUniformLocation(glProgLiquid, 'u_Fill');
      var uTilt = gl.getUniformLocation(glProgLiquid, 'u_Tilt');
      var uTime = gl.getUniformLocation(glProgLiquid, 'u_Time');
      var uCols = gl.getUniformLocation(glProgLiquid, 'u_Cols');
      var uWaveH = gl.getUniformLocation(glProgLiquid, 'u_WaveH');

      for (var oi = 0; oi < orbs.length; oi++) {
        var o = orbs[oi];
        if (o.dead) continue;

        var oR = orbRadius;
        gl.uniform2f(uPos, o.x, o.y);
        gl.uniform1f(uQuadSize, oR * 2.0);
        gl.uniform1f(uOrbRadius, oR);
        gl.uniform1f(uFill, o.fill);
        gl.uniform1f(uTilt, o.tilt);
        gl.uniform1f(uTime, o.time);
        gl.uniform1i(uCols, cfg.cols);

        // Upload wave heights (pad to 48 if needed)
        var waveData = new Float32Array(48);
        for (var wi = 0; wi < Math.min(cfg.cols, 48); wi++) {
          waveData[wi] = o.wH[wi] || 0;
        }
        gl.uniform1fv(uWaveH, waveData);

        gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
      }

      gl.bindVertexArray(null);
    }

    // ========= CATMULL-ROM =========
    function catmull(arr, frac) {
      var len = arr.length, ci = Math.floor(frac), fracPart = frac - ci;
      var p0 = arr[Math.max(0, ci-1)], p1 = arr[Math.min(ci, len-1)],
          p2 = arr[Math.min(ci+1, len-1)], p3 = arr[Math.min(ci+2, len-1)];
      var t2 = fracPart * fracPart, t3 = t2 * fracPart;
      return .5 * ((-p0+3*p1-3*p2+p3)*t3 + (2*p0-5*p1+4*p2-p3)*t2 + (-p0+p2)*fracPart + 2*p1);
    }

    // ========= ORB CLASS =========
    function Orb(posX, posY, fill) {
      this.x = posX; this.y = posY;

      this.tilt = 0; this.tiltV = 0;
      this.time = Math.random() * 100;
      this.wH = new Float32Array(cfg.cols);
      this.wV = new Float32Array(cfg.cols);
      this.innerDrops = [];
      this.dragging = false;
      this.flying = false;
      this.dragOff = {x:0, y:0};
      this.hist = [];
      this.dead = false;
      this.mergeAnim = 0;
      this.mergeTarget = null;
      this.wallDrops = [];
      this.embers = [];
      for (var idx = 0; idx < 12; idx++)
        this.embers.push({x:Math.random(), y:.6+Math.random()*.3, vx:(Math.random()-.5)*.004,
          vy:-.003-Math.random()*.005, size:1+Math.random()*2.5, life:Math.random()});
    }

    Orb.prototype.getRadius = function() { return cfg.orbSize / 2; };

    var orbs = [];
    var outerDrops = [];

    function addOrb(posX, posY, fill) {

    // ========= DRAG =========
    var draggedOrb = null;
    canvas.addEventListener('mousedown', function(evt) {
      var radius = cfg.orbSize / 2;
      for (var idx = orbs.length - 1; idx >= 0; idx--) {
        var orb = orbs[idx]; if (orb.dead || orb.mergeAnim > 0) continue;
        var dx = evt.clientX - orb.x, dy = evt.clientY - orb.y;
        if (dx*dx + dy*dy < (radius+30)*(radius+30)) {
          orb.dragging = true; orb.flying = false; orb.vx = 0; orb.vy = 0;
          orb.dragOff.x = dx; orb.dragOff.y = dy;
          orb.hist = [{x:evt.clientX, y:evt.clientY, t:Date.now()}];
          draggedOrb = orb;
          return;
        }
      }
    });
    document.addEventListener('mousemove', function(evt) {
      var orb = draggedOrb; if (!orb || !orb.dragging) return;
      var prevX = orb.x;
      orb.x = evt.clientX - orb.dragOff.x; orb.y = evt.clientY - orb.dragOff.y;
      var deltaX = orb.x - prevX;
      var clampedDeltaX = Math.max(-30, Math.min(30, deltaX));  // cap drag impulse
      orb.tiltV += clampedDeltaX * .1 * cfg.sloshing;
      var cols = orb.wH.length;
      for (var ci = 0; ci < cols; ci++) {
        orb.wV[ci] -= clampedDeltaX * (ci/(cols-1)-.5) * .04 * cfg.sloshing;
      }
      orb.hist.push({x:evt.clientX, y:evt.clientY, t:Date.now()});
      if (orb.hist.length > 6) orb.hist.shift();
    });
    document.addEventListener('mouseup', function() {
      var orb = draggedOrb; if (!orb) return;
      orb.dragging = false; draggedOrb = null;
      if (orb.hist.length >= 2) {
        var first = orb.hist[0], last = orb.hist[orb.hist.length-1];
        var elapsed = Math.max(1, last.t - first.t);
        orb.vx = (last.x - first.x) / elapsed * 16; orb.vy = (last.y - first.y) / elapsed * 16;
        if (orb.vx*orb.vx + orb.vy*orb.vy > 1) orb.flying = true;
      }
    });
    // Click to shake
    canvas.addEventListener('click', function(evt) {
      var radius = cfg.orbSize / 2;
      for (var idx = 0; idx < orbs.length; idx++) {
        var orb = orbs[idx]; if (orb.dead) continue;
        var dx = evt.clientX - orb.x, dy = evt.clientY - orb.y;
        if (dx*dx + dy*dy < radius*radius) {
          var clickCol = Math.floor((dx / radius * .5 + .5) * orb.wH.length);
          clickCol = Math.max(0, Math.min(orb.wH.length - 1, clickCol));
          for (var ci = 0; ci < orb.wH.length; ci++) {
            var dist = Math.abs(ci - clickCol);
            orb.wV[ci] += Math.exp(-dist*dist/8) * 8 * cfg.sloshing;
          }
        }
      }
    });

    // ========= SPAWN DROPS =========
    function spawnDroplets(orb, impactSpeed) {
      var radius = cfg.orbSize / 2, val = cfg.val;
      var pal = PALETTES[val] || PALETTES[5];

          stuck: false, stuckTimer: 0, stuckX: 0, stuckY: 0, dripping: false
        });
      }
      // Outer splash
      var outerCount = Math.min(8, Math.floor(absSpd * cfg.outerSplash / 10));
      for (var jdx = 0; jdx < outerCount; jdx++) {
        var angle = -Math.PI*.15 - Math.random()*Math.PI*.7;
        var spd = 2 + Math.random() * absSpd * .5;
        outerDrops.push({
          x: orb.x + (Math.random()-.5)*radius*.5, y: orb.y - radius*.3,
          vx: Math.cos(angle)*spd + orb.vx*.2, vy: Math.sin(angle)*spd,
          size: 1.5+Math.random()*3, life: 1, color: pal[~~(Math.random()*3)]
        });
      }
    }

    // ========= EXPLOSION SYSTEM =========
    function easeOutExpo(progress) {
      return progress >= 1 ? 1 : 1 - Math.pow(2, -10 * progress);
    }

    function triggerExplosion(epicenterX, epicenterY) {
      var pal = PALETTES[cfg.val] || PALETTES[5];
      var power = expCfg.blastPower;

      // Screen flash
      screenFlash.alpha = 0.6 * power;

      // Screen shake
      screenShake.intensity = expCfg.shakeIntensity * power;

      // T=0: Shockwave ring
      fxShockwaves.push({
        x: epicenterX, y: epicenterY,
        radius: 5, maxRadius: 150 * power,
        life: 1, lineWidth: 8 * power,
        color1: 'rgba(255,255,200,', color2: 'rgba(255,180,80,', color3: 'rgba(255,100,40,'
      });

      // T=0: Sparks (colored in orb palette)
      var sparkCount = Math.floor(20 * power);
      for (var si = 0; si < sparkCount; si++) {
        var sparkAngle = Math.random() * Math.PI * 2;
        var sparkSpeed = 3 + Math.random() * 8 * power;
        fxParticles.push({
          type: 'spark',
          x: epicenterX, y: epicenterY,
          vx: Math.cos(sparkAngle) * sparkSpeed,
          vy: Math.sin(sparkAngle) * sparkSpeed - 2,
          prevX: epicenterX, prevY: epicenterY,
          size: 1.5 + Math.random() * 2,
          life: 0.8 + Math.random() * 0.4,
          color: pal[~~(Math.random() * pal.length)],
          gravity: 0.1
        });
      }

      // T=50ms: Fireballs
      setTimeout(function() {
        var fireballCount = Math.floor(4 * power);
        for (var fi = 0; fi < fireballCount; fi++) {
          var fbAngle = (fi / fireballCount) * Math.PI * 2 + Math.random() * 0.5;
          var fbDist = 10 + Math.random() * 20;
          fxFireballs.push({
            x: epicenterX + Math.cos(fbAngle) * fbDist,
            y: epicenterY + Math.sin(fbAngle) * fbDist,
            radius: 5, maxRadius: 25 + Math.random() * 30 * power,
            life: 1, progress: 0, growSpeed: 0.03 + Math.random() * 0.02
          });
        }
      }, 50);

      // T=100ms: Debris
      setTimeout(function() {
        var debrisCount = Math.floor(10 * power);
        for (var di = 0; di < debrisCount; di++) {
          var debAngle = Math.random() * Math.PI * 2;
          var debSpeed = 2 + Math.random() * 5 * power;
          fxParticles.push({
            type: 'debris',
            x: epicenterX, y: epicenterY,
            vx: Math.cos(debAngle) * debSpeed,
            vy: Math.sin(debAngle) * debSpeed - 1,
            size: 2 + Math.random() * 4,
            life: 0.6 + Math.random() * 0.5,
            rotation: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.3,
            gravity: 0.15
          });
        }
      }, 100);

      // T=350ms: Smoke puffs
      setTimeout(function() {
        var smokeCount = Math.floor(6 * power);
        for (var smi = 0; smi < smokeCount; smi++) {
          var smAngle = Math.random() * Math.PI * 2;
          var smDist = Math.random() * 30 * power;
          fxSmoke.push({
            x: epicenterX + Math.cos(smAngle) * smDist,
            y: epicenterY + Math.sin(smAngle) * smDist,
            radius: 8 + Math.random() * 12,
            maxRadius: 30 + Math.random() * 40 * power,
            life: 1, fadeIn: 1, // fadeIn counts down from 1 to 0, used for fade-in effect
            vx: (Math.random() - 0.5) * 0.5,
            vy: -0.3 - Math.random() * 0.5
          });
        }
      }, 350);

      // Blast wave: push all surviving orbs away
      if (expCfg.waveForce > 0) {
        for (var oi = 0; oi < orbs.length; oi++) {
          var targetOrb = orbs[oi];
          if (targetOrb.dead) continue;
          var wdx = targetOrb.x - epicenterX;
          var wdy = targetOrb.y - epicenterY;
          var wdist = Math.sqrt(wdx * wdx + wdy * wdy);
          if (wdist < 1) wdist = 1;
          if (wdist < expCfg.waveRadius) {
            var normalizedDist = wdist / expCfg.waveRadius;
            var falloff = (1 - normalizedDist) * (1 - normalizedDist); // quadratic
            var force = expCfg.waveForce * falloff * power;
            targetOrb.vx += (wdx / wdist) * force;
            targetOrb.vy += (wdy / wdist) * force;
            targetOrb.flying = true;
            // Slosh the liquid
            for (var wci = 0; wci < targetOrb.wH.length; wci++) {
              targetOrb.wV[wci] += (Math.random() - 0.5) * force * 2 * cfg.sloshing;
            }
          }
        }
      }
    }

    // ========= ELASTIC BOUNCE =========
    function elasticBounce(orbA, orbB) {
      var dx = orbB.x - orbA.x;
      var dy = orbB.y - orbA.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 1) dist = 1;
      var nx = dx / dist;
      var ny = dy / dist;

      // Relative velocity along normal
      var relVx = orbA.vx - orbB.vx;
      var relVy = orbA.vy - orbB.vy;
      var relVelNormal = relVx * nx + relVy * ny;

      // Only resolve if approaching
      if (relVelNormal <= 0) return;

      // Equal mass elastic collision
      orbA.vx -= relVelNormal * nx;
      orbA.vy -= relVelNormal * ny;
      orbB.vx += relVelNormal * nx;
      orbB.vy += relVelNormal * ny;

      // Separate overlapping orbs
      var orbSize = cfg.orbSize;
      var overlap = orbSize * 0.9 - dist;
      if (overlap > 0) {
        orbA.x -= nx * overlap * 0.5;
        orbA.y -= ny * overlap * 0.5;
        orbB.x += nx * overlap * 0.5;
        orbB.y += ny * overlap * 0.5;
      }

      // Both should be flying after bounce
      orbA.flying = true;
      orbB.flying = true;

      // Slosh from impact
      var impactForce = Math.abs(relVelNormal);
      for (var ci = 0; ci < orbA.wH.length; ci++) {
        orbA.wV[ci] += (Math.random() - 0.5) * impactForce * cfg.sloshing;
        orbB.wV[ci] += (Math.random() - 0.5) * impactForce * cfg.sloshing;
      }
      if (impactForce > 2) {
        spawnDroplets(orbA, impactForce);
        spawnDroplets(orbB, impactForce);
      }
    }

    // ========= MERGE (cell division in reverse) =========
    var activeMerge = null;

    function startMerge(orbA, orbB) {
      orbA.flying = false; orbA.dragging = false;
      orbB.flying = false; orbB.dragging = false;
      orbA.vx = (orbA.vx + orbB.vx) * .5; orbA.vy = (orbA.vy + orbB.vy) * .5;
      orbB.vx = orbA.vx; orbB.vy = orbA.vy;

      var totalFill = orbA.fill + orbB.fill;
      var loss = cfg.mergeLoss / 100;
      var targetFill = Math.min(0.95, totalFill * (1 - loss));

      activeMerge = { a: orbA, b: orbB, t: 1.0, totalFill: totalFill, targetFill: targetFill,
        aStartFill: orbA.fill, bStartFill: orbB.fill };

      var pal = PALETTES[cfg.val] || PALETTES[5];
      var midX = (orbA.x + orbB.x) / 2, midY = (orbA.y + orbB.y) / 2;
      for (var idx = 0; idx < 8; idx++) {
        var ang = Math.random() * Math.PI * 2, spd = 2 + Math.random() * 3;
        outerDrops.push({ x:midX, y:midY, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
          size:2+Math.random()*2, life:1, color:pal[~~(Math.random()*3)] });
      }
    }

    function updateMerge() {
      if (!activeMerge) return;
      var merge = activeMerge, orbA = merge.a, orbB = merge.b;
      var radius = cfg.orbSize / 2;

      merge.t -= 0.012 * deltaTime;

      if (merge.t > 0.5) {
        var attract = (1 - merge.t) * 2;
        var dx = orbA.x - orbB.x, dy = orbA.y - orbB.y;
        var pull = .08 * deltaTime * (1 + attract);
        orbB.x += dx * pull; orbB.y += dy * pull;
        orbA.x -= dx * pull * .3; orbA.y -= dy * pull * .3;
        var contactSide = dx > 0 ? 0 : cfg.cols - 1;
        for (var ci = 0; ci < cfg.cols; ci++) {
          var bias = 1 - Math.abs(ci - contactSide) / cfg.cols;
          orbA.wV[ci] += bias * .3 * attract * deltaTime;
          orbB.wV[ci] += bias * .3 * attract * deltaTime;
        }
      } else if (merge.t > 0) {
        var phase2 = (0.5 - merge.t) / 0.5;
        orbA.fill = merge.aStartFill + (merge.targetFill - merge.aStartFill) * phase2;
        orbB.fill = Math.max(0.03, merge.bStartFill * (1 - phase2));
        var dx2 = orbA.x - orbB.x, dy2 = orbA.y - orbB.y;
        orbB.x += dx2 * .05 * deltaTime; orbB.y += dy2 * .05 * deltaTime;
        if (Math.random() < .15) {
          var pal = PALETTES[cfg.val] || PALETTES[5];
          var midX = (orbA.x+orbB.x)/2, midY = (orbA.y+orbB.y)/2;
          outerDrops.push({ x:midX+(Math.random()-.5)*radius, y:midY+(Math.random()-.5)*radius,
            vx:(Math.random()-.5)*2, vy:-1-Math.random()*2,
            size:1+Math.random()*2, life:.8, color:pal[~~(Math.random()*3)] });
        }
      } else {
        orbA.fill = merge.targetFill;
        orbB.dead = true;
        for (var ci2 = 0; ci2 < cfg.cols; ci2++) {
          orbA.wV[ci2] += (Math.random()-.5) * 8 * cfg.sloshing;
        }
        mergeFlashes.push({ x:orbA.x, y:orbA.y, r:radius*1.5, life:1 });
        activeMerge = null;
      }
    }

    // Draw merging orbs as ONE combined shape
    function drawMergedOrbs() {
      if (!activeMerge) return false;
      var merge = activeMerge, orbA = merge.a, orbB = merge.b;
      var radius = cfg.orbSize / 2, orbSize = cfg.orbSize;
      var val = cfg.val, tp = tempParams(val), pal = PALETTES[val] || PALETTES[5];

      ctx.save();
      ctx.beginPath();
      ctx.arc(orbA.x, orbA.y, radius, 0, Math.PI * 2);
      ctx.arc(orbB.x, orbB.y, radius, 0, Math.PI * 2);
      ctx.clip();

      var minX = Math.min(orbA.x, orbB.x) - radius, maxX = Math.max(orbA.x, orbB.x) + radius;
      var minY = Math.min(orbA.y, orbB.y) - radius, maxY = Math.max(orbA.y, orbB.y) + radius;
      var bg = ctx.createRadialGradient(orbA.x - radius*.3, orbA.y - radius*.3, 0, orbA.x, orbA.y, radius*2);
      bg.addColorStop(0, val >= 9 ? '#2a1510' : '#1a1a2e');
      bg.addColorStop(1, val >= 9 ? '#150808' : '#0a0a15');
      ctx.fillStyle = bg;
      ctx.fillRect(minX, minY, maxX - minX, maxY - minY);

      var drawLiquid = function(orb) {
        var baseY = orb.y - radius + orbSize * (1 - orb.fill);
        var layers = [
          {am:1,fr:1,sp:.8,ci:2,al:1},{am:.8,fr:1.5,sp:1.2,ci:0,al:.7},{am:.6,fr:2.2,sp:1.5,ci:1,al:.6}
        ];
        for (var li = 0; li < Math.min(cfg.layers, 3); li++) {
          var ld = layers[li];
          ctx.beginPath();
          for (var lx = 0; lx <= orbSize; lx++) {
            var px = orb.x - radius + lx;
            var colFrac = lx / orbSize * (cfg.cols - 1);
            var wOff = catmull(orb.wH, colFrac);
            var wy = baseY + Math.sin(lx*.1*ld.fr + orb.time*tp.speed*ld.sp)*tp.amp*ld.am
              + Math.sin(lx*.17*ld.fr + orb.time*tp.speed*ld.sp*.6)*tp.amp*ld.am*.5
              + (orb.tilt * (lx - radius) / radius) * (3 + val*.5) + wOff;
            lx === 0 ? ctx.moveTo(px, wy) : ctx.lineTo(px, wy);
          }
          ctx.lineTo(orb.x + radius, orb.y + radius); ctx.lineTo(orb.x - radius, orb.y + radius); ctx.closePath();
          var lg = ctx.createLinearGradient(0, baseY, 0, orb.y + radius);
          lg.addColorStop(0, pal[ld.ci]); lg.addColorStop(.6, pal[2]); lg.addColorStop(1, '#000');
          ctx.fillStyle = lg; ctx.globalAlpha = ld.al; ctx.fill();
        }
        ctx.globalAlpha = 1;
      };
      drawLiquid(orbB);
      drawLiquid(orbA);

      var drawInnerDrops = function(orb) {
        for (var di = 0; di < orb.innerDrops.length; di++) {
          var drop = orb.innerDrops[di];
          var dropX = (drop.stuck ? drop.stuckX : drop.x) + orb.x;
          var dropY = (drop.stuck ? drop.stuckY : drop.y) + orb.y;
          if (drop.dripping) { dropX = drop.stuckX + orb.x; dropY = drop.y + orb.y; }
          ctx.globalAlpha = drop.life * .8; ctx.fillStyle = drop.color;

        }
      };
      drawInnerDrops(orbB);
      drawInnerDrops(orbA);
      ctx.globalAlpha = 1;

      ctx.restore();

      var drawGlass = function(orb, other) {
        if (!cfg.glass) return;
        var dx = other.x - orb.x, dy = other.y - orb.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        var overlapAngle = dist < radius * 2 ? Math.acos(Math.min(1, dist / (2 * radius))) : 0;
        var angleToOther = Math.atan2(dy, dx);

        ctx.arc(orb.x, orb.y, radius, angleToOther + overlapAngle, angleToOther - overlapAngle + Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1; ctx.stroke();
        var hg = ctx.createRadialGradient(orb.x-radius*.2, orb.y-radius*.55, 0, orb.x-radius*.1, orb.y-radius*.3, radius*.6);
        hg.addColorStop(0, 'rgba(255,255,255,.2)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(orb.x, orb.y, radius-1, 0, Math.PI*2); ctx.fill();

      drawGlass(orbB, orbA);

      ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '10px monospace';
      if (cfg.showFill) {

        ctx.fillText(Math.round(orbB.fill*100)+'%', orbB.x-radius+4, orbB.y+radius-4);
      }

      return true;
    }

    // ========= FX UPDATE =========
    function updateFX() {
      // Sparks and debris
      for (var pi = fxParticles.length - 1; pi >= 0; pi--) {
        var part = fxParticles[pi];
        part.prevX = part.x; part.prevY = part.y;
        part.x += part.vx * deltaTime;
        part.y += part.vy * deltaTime;
        part.vy += (part.gravity || 0.1) * deltaTime;
        part.vx *= 0.99;
        part.life -= 0.02 * deltaTime;
        if (part.life <= 0) { fxParticles.splice(pi, 1); }
      }

      // Fireballs
      for (var fi = fxFireballs.length - 1; fi >= 0; fi--) {
        var fireball = fxFireballs[fi];
        fireball.progress += fireball.growSpeed * deltaTime;
        fireball.radius = fireball.maxRadius * easeOutExpo(Math.min(1, fireball.progress));
        fireball.life -= 0.02 * deltaTime;
        if (fireball.life <= 0) { fxFireballs.splice(fi, 1); }
      }

      // Shockwaves
      for (var si = fxShockwaves.length - 1; si >= 0; si--) {
        var wave = fxShockwaves[si];
        wave.radius += (wave.maxRadius - wave.radius) * 0.1 * deltaTime;
        wave.life -= 0.03 * deltaTime;
        wave.lineWidth *= 0.97;
        if (wave.life <= 0) { fxShockwaves.splice(si, 1); }
      }

      // Smoke
      for (var smi = fxSmoke.length - 1; smi >= 0; smi--) {
        var smoke = fxSmoke[smi];
        smoke.x += smoke.vx * deltaTime;
        smoke.y += smoke.vy * deltaTime;
        smoke.radius += (smoke.maxRadius - smoke.radius) * 0.03 * deltaTime;
        smoke.fadeIn = Math.max(0, smoke.fadeIn - 0.05 * deltaTime);
        smoke.life -= 0.012 * deltaTime;
        if (smoke.life <= 0) { fxSmoke.splice(smi, 1); }
      }

      // Screen shake
      if (screenShake.intensity > 0.1) {
        screenShake.x = (Math.random() - 0.5) * 2 * screenShake.intensity * 10;
        screenShake.y = (Math.random() - 0.5) * 2 * screenShake.intensity * 10;
        screenShake.intensity *= Math.pow(screenShake.decay, deltaTime);
      } else {
        screenShake.x = 0; screenShake.y = 0; screenShake.intensity = 0;
      }

      // Screen flash
      if (screenFlash.alpha > 0.01) {
        screenFlash.alpha *= Math.pow(screenFlash.decay, deltaTime);
      } else {
        screenFlash.alpha = 0;
      }
    }

    // ========= FX RENDER =========
    function drawFX() {
      // Smoke (source-over, gray circles with fade-in/fade-out)
      ctx.globalCompositeOperation = 'source-over';
      for (var smi = 0; smi < fxSmoke.length; smi++) {
        var smoke = fxSmoke[smi];
        var smokeAlpha = smoke.life * (1 - smoke.fadeIn) * 0.3;
        if (smokeAlpha < 0.01) continue;
        ctx.globalAlpha = smokeAlpha;
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.arc(smoke.x, smoke.y, smoke.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Fireballs (lighter composite, radial gradient)
      ctx.globalCompositeOperation = 'lighter';
      for (var fi = 0; fi < fxFireballs.length; fi++) {
        var fireball = fxFireballs[fi];
        if (fireball.life < 0.01) continue;
        ctx.globalAlpha = fireball.life * 0.8;
        var fbGrad = ctx.createRadialGradient(fireball.x, fireball.y, 0, fireball.x, fireball.y, fireball.radius);
        fbGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
        fbGrad.addColorStop(0.2, 'rgba(255,255,100,0.7)');
        fbGrad.addColorStop(0.5, 'rgba(255,160,20,0.4)');
        fbGrad.addColorStop(1, 'rgba(80,20,0,0)');
        ctx.fillStyle = fbGrad;
        ctx.beginPath();
        ctx.arc(fireball.x, fireball.y, fireball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Shockwaves (lighter, three concentric rings)
      for (var si = 0; si < fxShockwaves.length; si++) {
        var wave = fxShockwaves[si];
        if (wave.life < 0.01) continue;
        ctx.globalAlpha = wave.life * 0.6;
        ctx.lineWidth = wave.lineWidth;
        for (var ring = 0; ring < 3; ring++) {
          var ringRadius = wave.radius * (1 - ring * 0.15);
          if (ringRadius < 1) continue;
          ctx.strokeStyle = ring === 0 ? wave.color1 + (wave.life * 0.8).toFixed(2) + ')'
            : ring === 1 ? wave.color2 + (wave.life * 0.5).toFixed(2) + ')'
            : wave.color3 + (wave.life * 0.3).toFixed(2) + ')';
          ctx.beginPath();
          ctx.arc(wave.x, wave.y, ringRadius, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // Sparks (lighter, line trail + head dot)
      for (var pi = 0; pi < fxParticles.length; pi++) {
        var part = fxParticles[pi];
        if (part.life < 0.01) continue;
        if (part.type === 'spark') {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = part.life;
          ctx.strokeStyle = part.color;
          ctx.lineWidth = part.size * 0.5;
          ctx.beginPath();
          ctx.moveTo(part.prevX, part.prevY);
          ctx.lineTo(part.x, part.y);
          ctx.stroke();
          ctx.fillStyle = part.color;
          ctx.beginPath();
          ctx.arc(part.x, part.y, part.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (part.type === 'debris') {
          ctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = part.life * 0.7;
          ctx.save();
          ctx.translate(part.x, part.y);
          ctx.rotate(part.rotation);
          part.rotation += part.rotSpeed * deltaTime;
          ctx.fillStyle = '#333';
          ctx.fillRect(-part.size/2, -part.size/4, part.size, part.size/2);
          ctx.restore();
        }
      }

      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // ========= MAIN LOOP =========
    var deltaTime = 1, lastTimestamp = 0, currentFps = 60, frameCount = 0, fpsTimer = 0, globalTime = 0;
    var totalFxCount = 0;

    // Auto-adapt state
    var adaptTarget = 5000;

    function loop(timestamp) {
      requestAnimationFrame(loop);
      try {
        if (lastTimestamp > 0) deltaTime = Math.min((timestamp - lastTimestamp) / 16.667, 3);
        lastTimestamp = timestamp; frameCount++;
        if (timestamp - fpsTimer > 500) {
          currentFps = Math.round(frameCount * 1000 / (timestamp - fpsTimer));
          frameCount = 0; fpsTimer = timestamp;

          // Auto-adapt
          if (cfg.autoAdapt) {
            if (currentFps < 35 && cfg.maxParticles > 500) {
              cfg.maxParticles = Math.max(500, cfg.maxParticles - 200);
              var maxPartSlider = document.getElementById('c-maxParticles');
              if (maxPartSlider) { maxPartSlider.value = cfg.maxParticles; }
              var maxPartDisplay = document.getElementById('v-maxParticles');
              if (maxPartDisplay) maxPartDisplay.textContent = cfg.maxParticles;
            } else if (currentFps > 55 && cfg.maxParticles < adaptTarget) {
              cfg.maxParticles = Math.min(adaptTarget, cfg.maxParticles + 100);
              var maxPartSlider2 = document.getElementById('c-maxParticles');
              if (maxPartSlider2) { maxPartSlider2.value = cfg.maxParticles; }
              var maxPartDisplay2 = document.getElementById('v-maxParticles');
              if (maxPartDisplay2) maxPartDisplay2.textContent = cfg.maxParticles;
            }
          }
        }

        globalTime += .06 * deltaTime;
        orbRadius = cfg.orbSize / 2;
        var orbSize = cfg.orbSize;
        var val = cfg.val, tp = tempParams(val), pal = PALETTES[val] || PALETTES[5];

        // ---- UPDATE EACH ORB ----
        for (var oi = 0; oi < orbs.length; oi++) {
          var orb = orbs[oi];
          if (orb.dead) continue;
          orb.time += .06 * deltaTime;

          var inMerge = activeMerge && (orb === activeMerge.a || orb === activeMerge.b);

          if (!inMerge && orb.flying && !orb.dragging) {
            orb.vy += .15 * deltaTime;
            orb.vx *= Math.pow(cfg.airDrag, deltaTime);
            orb.x += orb.vx * deltaTime; orb.y += orb.vy * deltaTime;
            if (orb.y > canvas.height - orbRadius) {
              var prevVy = orb.vy;
              orb.y = canvas.height - orbRadius; orb.vy = -orb.vy * cfg.bounce;
              var deltaVy = orb.vy - prevVy;
              if (Math.abs(deltaVy) > 1) {
                var mid = (cfg.cols-1)/2;
                for (var ci=0; ci<cfg.cols; ci++) {
                  var dist = (ci-mid)/(cfg.cols*.3);
                  orb.wV[ci] += deltaVy * .4 * cfg.sloshing * Math.exp(-dist*dist*.5);
                }
                if (Math.abs(deltaVy) > 2) spawnDroplets(orb, deltaVy);
              }
              if (Math.abs(orb.vy) < .5) { orb.flying = false; orb.vx = orb.vy = 0; }
            }
            if (orb.y < orbRadius) { orb.y = orbRadius; orb.vy = -orb.vy * cfg.bounce; }
            if (orb.x < orbRadius) { orb.x = orbRadius; orb.vx = -orb.vx * cfg.bounce; }
            if (orb.x > canvas.width - orbRadius) { orb.x = canvas.width - orbRadius; orb.vx = -orb.vx * cfg.bounce; }
            if (Math.abs(orb.vx) > 1) orb.tiltV -= orb.vx * .03 * cfg.sloshing * deltaTime;
          }
          if (!inMerge && !orb.dragging && !orb.flying) { orb.vx *= .92; orb.vy *= .92; }

          // Tilt — soft-clamp + adaptive damping
          orb.tilt += orb.tiltV * deltaTime;
          var tiltDamp = .92;
          var absTilt = Math.abs(orb.tilt);
          if (absTilt > 2.0) {
            // Progressive damping: the further past 2.0, the stronger the brake
            var excess = (absTilt - 2.0) / 3.0;  // 0..1 over range 2..5
            tiltDamp = .92 - Math.min(0.3, excess * 0.3);  // 0.92 → 0.62
          }
          orb.tiltV *= Math.pow(tiltDamp, deltaTime);
          orb.tiltV -= orb.tilt * .06 * deltaTime;
          // Hard cap as safety net (soft-clamp keeps it well under this)
          if (orb.tilt > 5.0) { orb.tilt = 5.0; orb.tiltV *= .3; }
          if (orb.tilt < -5.0) { orb.tilt = -5.0; orb.tiltV *= .3; }

          // Resize wave arrays if cols changed
          if (orb.wH.length !== cfg.cols) {
            orb.wH = new Float32Array(cfg.cols);
            orb.wV = new Float32Array(cfg.cols);
          }

          // Wave physics
          var cols = cfg.cols;
          var sf = Math.min(1, 24 / cols);
          var sdt = deltaTime * sf;
          var maxAmp = orbSize * .4;
          var softLimit = maxAmp * .6;  // start damping at 60% of max
          for (var step = 0; step < cfg.substeps; step++) {
            for (var wi = 0; wi < cols; wi++) {
              orb.wV[wi] += -cfg.spring * orb.wH[wi] * sdt;
              // Adaptive damping: stronger when amplitude exceeds soft limit
              var absH = Math.abs(orb.wH[wi]);
              var waveDamp = cfg.damping;
              if (absH > softLimit) {
                var overRatio = (absH - softLimit) / (maxAmp - softLimit);
                waveDamp = cfg.damping - Math.min(0.15, overRatio * 0.15);
              }
              orb.wV[wi] *= Math.pow(waveDamp, sdt);
              orb.wH[wi] += orb.wV[wi] * sdt * .25;
              // Safety hard cap (soft-clamp keeps amplitude well below this)
              if (orb.wH[wi] > maxAmp) { orb.wH[wi] = maxAmp; orb.wV[wi] *= .3; }
              if (orb.wH[wi] < -maxAmp) { orb.wH[wi] = -maxAmp; orb.wV[wi] *= .3; }
            }
            for (var wi2 = 0; wi2 < cols; wi2++) {
              if (wi2 > 0) { var d1 = (orb.wH[wi2]-orb.wH[wi2-1])*cfg.spread*sdt; orb.wV[wi2]-=d1; orb.wV[wi2-1]+=d1; }
              if (wi2 < cols-1) { var d2 = (orb.wH[wi2]-orb.wH[wi2+1])*cfg.spread*sdt; orb.wV[wi2]-=d2; orb.wV[wi2+1]+=d2; }
            }
          }
          if (!isFinite(orb.wH[0])) { for (var fi=0;fi<cols;fi++){orb.wH[fi]=0;orb.wV[fi]=0;} }

          // Inner drops physics
          for (var di = orb.innerDrops.length - 1; di >= 0; di--) {
            var drop = orb.innerDrops[di];
            if (drop.stuck) {
              drop.stuckTimer -= deltaTime;
              if (drop.stuckTimer <= 0) {
                drop.dripping = true;
                drop.stuck = false;
              }
              continue;
            }
            if (drop.dripping) {
              drop.y += 0.8 * deltaTime;
              drop.life -= .015 * deltaTime;
              var surfY = -orbRadius + orbSize * (1 - orb.fill);
              if (drop.life <= 0 || drop.y > surfY) { orb.innerDrops.splice(di, 1); continue; }
              continue;
            }
            drop.x += drop.vx * deltaTime; drop.y += drop.vy * deltaTime;
            drop.vy += .12 * deltaTime;
            drop.life -= .015 * deltaTime;
            var distFromCenter = Math.sqrt(drop.x*drop.x + drop.y*drop.y);
            if (distFromCenter > orbRadius * .88) {
              drop.stuck = true;
              drop.stuckTimer = 15 + Math.random() * 25;
              drop.stuckX = drop.x; drop.stuckY = drop.y;
              drop.vx = 0; drop.vy = 0;
              continue;
            }
            var surfY2 = -orbRadius + orbSize * (1 - orb.fill);
            if (drop.life <= 0 || drop.y > surfY2 + 3) { orb.innerDrops.splice(di, 1); }
          }
        }

        // ---- ORB-ORB COLLISION ----
        if (cfg.collisionMode !== 'none') {
          if (cfg.collisionMode === 'merge') {
            // Merge mode: original behavior
            if (!activeMerge) {
              for (var ai = 0; ai < orbs.length; ai++) {
                for (var bi = ai + 1; bi < orbs.length; bi++) {
                  var orbA = orbs[ai], orbB = orbs[bi];
                  if (orbA.dead || orbB.dead) continue;
                  var cdx = orbA.x - orbB.x, cdy = orbA.y - orbB.y;
                  var cdist = Math.sqrt(cdx*cdx + cdy*cdy);
                  if (cdist < orbSize * .9) {
                    if (orbA.fill >= orbB.fill) startMerge(orbA, orbB);
                    else startMerge(orbB, orbA);
                    break;
                  }
                }
                if (activeMerge) break;
              }
            }
          } else if (cfg.collisionMode === 'bounce' || cfg.collisionMode === 'bounce-explode') {
            // Bounce modes
            for (var ai2 = 0; ai2 < orbs.length; ai2++) {
              for (var bi2 = ai2 + 1; bi2 < orbs.length; bi2++) {
                var orbA2 = orbs[ai2], orbB2 = orbs[bi2];
                if (orbA2.dead || orbB2.dead) continue;
                var cdx2 = orbA2.x - orbB2.x, cdy2 = orbA2.y - orbB2.y;
                var cdist2 = Math.sqrt(cdx2*cdx2 + cdy2*cdy2);
                if (cdist2 < orbSize * .9) {
                  elasticBounce(orbA2, orbB2);
                  if (cfg.collisionMode === 'bounce-explode') {
                    var midX = (orbA2.x + orbB2.x) / 2;
                    var midY = (orbA2.y + orbB2.y) / 2;
                    triggerExplosion(midX, midY);
                  }
                }
              }
            }
          }
        }

        // Update active merge animation (only in merge mode)
        if (cfg.collisionMode === 'merge') {
          updateMerge();
        }

        // Update FX
        updateFX();

        // Clean dead orbs
        for (var deadIdx = orbs.length - 1; deadIdx >= 0; deadIdx--) {
          if (orbs[deadIdx].dead) orbs.splice(deadIdx, 1);
        }

        // Enforce max particles
        totalFxCount = fxParticles.length + fxFireballs.length + fxShockwaves.length + fxSmoke.length + outerDrops.length;
        while (totalFxCount > cfg.maxParticles && fxParticles.length > 0) {
          fxParticles.shift(); totalFxCount--;
        }
        while (totalFxCount > cfg.maxParticles && fxSmoke.length > 0) {
          fxSmoke.shift(); totalFxCount--;
        }

        // ---- RENDER ----
        // Apply screen shake via body transform
        if (screenShake.intensity > 0.1) {
          document.body.style.transform = 'translate(' + screenShake.x.toFixed(1) + 'px,' + screenShake.y.toFixed(1) + 'px)';
        } else {
          document.body.style.transform = '';
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw background (Canvas2D mode)
        if (RENDERER !== 'webgl2' && BG_MODE !== 'none') {
          drawBgCanvas2D(ctx, canvas.width, canvas.height, globalTime);
        }

        // WebGL2: render background + orbs on glCanvas
        if (RENDERER === 'webgl2') {
          syncRendererCanvases();
          // Background on glCanvas before orbs
          if (BG_MODE !== 'none') {
            gl.viewport(0, 0, glW, glH);
            gl.disable(gl.BLEND);
            renderBgWebGL(globalTime);
            gl.enable(gl.BLEND);
            gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          }
          renderOrbsWebGL();
        }

        // Draw each orb
        var drawOrder = [];
        for (var oi2 = 0; oi2 < orbs.length; oi2++) {
          if (orbs[oi2].dead) continue;
          drawOrder.push(orbs[oi2]);
        }
        if (activeMerge) {
          drawOrder.sort(function(sortA, sortB) {
            if (sortA === activeMerge.b) return -1;
            if (sortB === activeMerge.b) return 1;
            if (sortA === activeMerge.a) return 1;
            if (sortB === activeMerge.a) return -1;
            return 0;
          });
        }
        var mergedDrawn = (cfg.collisionMode === 'merge') ? drawMergedOrbs() : false;

        for (var oi3 = 0; oi3 < drawOrder.length; oi3++) {
          var orb = drawOrder[oi3];
          if (mergedDrawn && activeMerge && (orb === activeMerge.a || orb === activeMerge.b)) continue;
          var oR = orbRadius;

          ctx.save();
          ctx.translate(orb.x, orb.y);

          // Clip
          ctx.save();
          ctx.beginPath(); ctx.arc(0, 0, oR - .5, 0, Math.PI * 2); ctx.clip();

          var baseY = -oR + oR * 2 * (1 - orb.fill);

          if (RENDERER !== 'webgl2') {
          // Background
          var bg = ctx.createRadialGradient(-oR*.3, -oR*.3, 0, 0, 0, oR);
          bg.addColorStop(0, val >= 9 ? '#2a1510' : '#1a1a2e');
          bg.addColorStop(1, val >= 9 ? '#150808' : '#0a0a15');
          ctx.fillStyle = bg; ctx.fillRect(-oR, -oR, oR*2, oR*2);

          // Liquid
          var layerDefs = [
            {am:1,fr:1,sp:.8,ci:2,al:1},{am:.8,fr:1.5,sp:1.2,ci:0,al:.7},{am:.6,fr:2.2,sp:1.5,ci:1,al:.6},
            {am:.4,fr:3,sp:2,ci:3,al:.4},{am:.3,fr:4,sp:2.5,ci:0,al:.3}
          ];
          for (var li = 0; li < Math.min(cfg.layers, 5); li++) {
            var ld = layerDefs[li];
            ctx.beginPath();
            for (var lx = 0; lx <= orbSize; lx++) {
              var px = lx - oR;
              var colFrac = lx / orbSize * (cfg.cols - 1);
              var wOff = catmull(orb.wH, colFrac);
              var wy = baseY + Math.sin(lx*.1*ld.fr + orb.time*tp.speed*ld.sp)*tp.amp*ld.am
                + Math.sin(lx*.17*ld.fr + orb.time*tp.speed*ld.sp*.6)*tp.amp*ld.am*.5
                + (orb.tilt * px / oR) * (3 + val*.5) + wOff;
              lx === 0 ? ctx.moveTo(px, wy) : ctx.lineTo(px, wy);
            }
            ctx.lineTo(oR, oR); ctx.lineTo(-oR, oR); ctx.closePath();
            var lg = ctx.createLinearGradient(0, baseY, 0, oR);
            lg.addColorStop(0, pal[ld.ci]); lg.addColorStop(.6, pal[2]); lg.addColorStop(1, '#000');
            ctx.fillStyle = lg; ctx.globalAlpha = ld.al; ctx.fill();
          }
          ctx.globalAlpha = 1;

          // Surface glow
          if (cfg.surfaceGlow && val >= 5) {
            var glowIntensity = (val-4)/6;
            var sg = ctx.createRadialGradient(0,baseY,0, 0,baseY,oR*.9);
            sg.addColorStop(0,'rgba(255,220,80,'+(0.15+glowIntensity*.4).toFixed(2)+')');
            sg.addColorStop(1,'rgba(255,100,0,0)');
            ctx.fillStyle = sg; ctx.fillRect(-oR,baseY-10,orbSize,20);
          }
          } // end Canvas2D-only orb rendering

          // Bubbles
          if (cfg.bubbles && tp.bubble > .1) {
            for (var bIdx = 0; bIdx < Math.floor(tp.bubble*6); bIdx++) {
              var bx = Math.sin(orb.time*.8+bIdx*4.3)*oR*.5;
              var by = baseY + 5 + ((orb.time*20+bIdx*17) % (oR-baseY+oR));
              ctx.beginPath(); ctx.arc(bx,by,Math.max(.5,1+tp.bubble*1.5),0,Math.PI*2);
              ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fill();
            }
          }

          // Embers
          if (cfg.embers) {
            var activeEmbers = Math.min(tp.embers, orb.embers.length);
            for (var eIdx = 0; eIdx < activeEmbers; eIdx++) {
              var ember = orb.embers[eIdx];
              ember.x += ember.vx*deltaTime; ember.y += ember.vy*deltaTime; ember.life += .005*deltaTime;
              if (ember.life > 1 || ember.y < (1-orb.fill)-.05) { ember.life=0; ember.y=.6+Math.random()*.3; ember.x=Math.random(); }
              var ex = (ember.x-.5)*orbSize, ey = -oR + ember.y*orbSize;
              ctx.beginPath(); ctx.arc(ex,ey,ember.size,0,Math.PI*2);
              ctx.fillStyle = val>=8 ? 'rgba(255,200,60,.5)' : 'rgba(200,200,255,.3)'; ctx.fill();
            }
          }

          // Inner drops
          for (var di2 = 0; di2 < orb.innerDrops.length; di2++) {
            var drop = orb.innerDrops[di2];
            var dropX = drop.stuck ? drop.stuckX : drop.x;
            var dropY = drop.stuck ? drop.stuckY : drop.y;
            if (drop.dripping) { dropX = drop.stuckX; dropY = drop.y; }
            ctx.globalAlpha = drop.life * .8;
            ctx.fillStyle = drop.color;
            ctx.beginPath(); ctx.arc(dropX, dropY, drop.size, 0, Math.PI*2); ctx.fill();
            if (!drop.stuck && !drop.dripping) {
              ctx.globalAlpha = drop.life * .3;
              ctx.beginPath(); ctx.arc(dropX - drop.vx*.3, dropY - drop.vy*.3, drop.size*.6, 0, Math.PI*2); ctx.fill();
            }
          }
          ctx.globalAlpha = 1;

          ctx.restore(); // unclip

          // Cracks
          if (cfg.cracks > 0) {
            ctx.save(); ctx.beginPath(); ctx.arc(0,0,oR,0,Math.PI*2); ctx.clip();
            ctx.strokeStyle = 'rgba(200,220,255,.3)'; ctx.lineWidth = .8;
            for (var crIdx = 0; crIdx < cfg.cracks; crIdx++) {
              var cs = crIdx*7.31+1.23, ca = cs%(Math.PI*2), cl = oR*(.4+(Math.sin(cs*3.7)*.5+.5)*.5);
              var cx = Math.cos(ca)*oR*.15, cy = Math.sin(ca)*oR*.15;
              ctx.beginPath(); ctx.moveTo(cx,cy);
              var segs = 3+Math.floor(Math.sin(cs*2.1)*2+2);
              for (var seg=1;seg<=segs;seg++) {
                var segT=seg/segs, sa=ca+Math.sin(cs*seg*1.7)*.3, sr=oR*.15+cl*segT;
                cx=Math.cos(sa)*sr; cy=Math.sin(sa)*sr; ctx.lineTo(cx,cy);
                if (seg>=2&&Math.sin(cs*seg*4.3)>.3) {
                  var ba=sa+(Math.sin(cs*seg)>0?.5:-.5), bl=cl*.25;
                  ctx.lineTo(cx+Math.cos(ba)*bl,cy+Math.sin(ba)*bl); ctx.moveTo(cx,cy);
                }
              }
              ctx.stroke();
            }
            ctx.restore();
          }

          // Glass
          if (cfg.glass) {
            ctx.beginPath(); ctx.arc(0,0,oR,0,Math.PI*2);
            ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1; ctx.stroke();
            var hg = ctx.createRadialGradient(-oR*.2,-oR*.55,0,-oR*.1,-oR*.3,oR*.6);
            hg.addColorStop(0,'rgba(255,255,255,.25)'); hg.addColorStop(1,'rgba(255,255,255,0)');
            ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0,0,oR-1,0,Math.PI*2); ctx.fill();
          }

          // Fill indicator
          ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '10px monospace';
          if (cfg.showFill) ctx.fillText(Math.round(orb.fill*100)+'%', -oR+4, oR-4);

          ctx.restore(); // untranslate
        }

        // Outer drops
        for (var odi = outerDrops.length - 1; odi >= 0; odi--) {
          var od = outerDrops[odi];
          od.x += od.vx*deltaTime; od.y += od.vy*deltaTime; od.vy += .15*deltaTime; od.life -= .02*deltaTime;
          if (od.life <= 0 || od.y > canvas.height) { outerDrops.splice(odi,1); continue; }
          ctx.globalAlpha = od.life; ctx.fillStyle = od.color;
          ctx.beginPath(); ctx.arc(od.x,od.y,od.size*od.life,0,Math.PI*2); ctx.fill();
        }

        // Merge flashes
        for (var mfi = mergeFlashes.length - 1; mfi >= 0; mfi--) {
          var mf = mergeFlashes[mfi];
          mf.life -= .04 * deltaTime;
          if (mf.life <= 0) { mergeFlashes.splice(mfi,1); continue; }
          var mr = mf.r * (2 - mf.life);
          var mg = ctx.createRadialGradient(mf.x,mf.y,0,mf.x,mf.y,mr);
          mg.addColorStop(0, 'rgba(255,255,255,'+(mf.life*.5).toFixed(2)+')');
          mg.addColorStop(.5, 'rgba(200,200,255,'+(mf.life*.2).toFixed(2)+')');
          mg.addColorStop(1, 'rgba(100,100,255,0)');
          ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mf.x,mf.y,mr,0,Math.PI*2); ctx.fill();
        }

        // ---- FX rendering (after orbs, before debug) ----
        drawFX();

        // ---- Screen flash overlay ----
        if (screenFlash.alpha > 0.01) {
          ctx.globalAlpha = screenFlash.alpha;
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.globalAlpha = 1;

        // Debug
        var fills = orbs.map(function(orb){ return Math.round(orb.fill*100); }).join(',');
        document.getElementById('dbg').textContent =
          currentFps+' fps | orbs='+orbs.length+' | fills=['+fills+'] | drops='+outerDrops.length;

        // Performance panel
        totalFxCount = fxParticles.length + fxFireballs.length + fxShockwaves.length + fxSmoke.length + outerDrops.length;
        var perfEl = document.getElementById('perf-stats');
        if (perfEl) {
          perfEl.textContent = 'FPS: ' + currentFps + ' | Particles: ' + totalFxCount;
        }

      } catch (loopError) {
        // Ensure rAF always fires even on error
        if (typeof console !== 'undefined') console.error('Loop error:', loopError);
      }
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
